name: Java CI with Maven

# Controls when the workflow will run
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checks-out your repository under $GITHUB_WORKSPACE, so the job can access it
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Sets up a stable, open-source distribution of JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Step 3: Compiles the source files and executes all JUnit tests automatically
    # The '-B' flag runs Maven in non-interactive (batch) mode to prevent build freezes
    - name: Build and Run All Unit Tests
      run: mvn -B test